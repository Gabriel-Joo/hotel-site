<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HOTEL — 객실선택</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="./css/reservation-select.css" />
    <!-- 반응형(<=1000px)은 페이지 CSS "다음에" 로드되어야 모바일 규칙이 이김 -->
    <link rel="stylesheet" href="./css/responsive.css" />
    <!-- Font Awesome (CDN, 아이콘: 공통 푸터 SNS 등) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <!-- 헤더 (Web Component: common.js가 <my-header> 정의) -->
    <my-header></my-header>

    <!-- 2. 타이틀 배너 — 전체폭 (공통 .title-banner + 배경이미지 인라인) -->
    <section class="title-banner" style="background-image: url('./images/banner_reservation.jpg')">
      <div class="title-banner__inner">
        <h1 class="title-banner__title">RESERVATION</h1>
        <p class="title-banner__subtitle">실시간예약</p>
      </div>
    </section>

    <!-- 3 ~ 5. 본문: content 영역(1440) 안에서 실제폭 ~1180 가운데 정렬 -->
    <main>
      <div class="content">
        <div class="select-wrap">
          <!-- 3. 섹션 제목 -->
          <h2 class="section-title">객실 선택</h2>

          <!-- 4. 객실 선택 띠 — js가 getRooms() 로 렌더 -->
          <ul class="room-banners" id="room-banners"></ul>
          <!-- 데이터/렌더 에러 메시지 자리 -->
          <p class="room-banners__error" id="room-banners-error" hidden></p>

          <!-- 5. 취소 및 환불 규정 (common.css .refund 공통 스타일) -->
          <div class="refund select__refund">
            <div class="refund__bar">취소 및 환불 규정</div>
            <div class="refund__box">
              <p class="refund__text">
                숙박 예정일 1일 전 18시까지는 위약금 없이 취소 및 변경이 가능합니다.<br />
                숙박 예정일 1일 전 18시 이후 취소/변경 및 노쇼(No-show) 발생 시,
              </p>
              <p class="refund__text refund__text--indent">
                - 성수기 : 최초 1일 숙박 요금의 80%가 위약금으로 부과됩니다.<br />
                - 비수기(성수기 외 기간) : 최초 1일 숙박 요금의 10%가 위약금으로 부과됩니다.
              </p>
              <p class="refund__text">일부 패키지의 경우 별도의 취소규정이 적용됩니다.</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- 푸터 (Web Component) + 맨 위로 버튼 (Web Component) -->
    <my-footer></my-footer>

    <to-the-top></to-the-top>

    <script type="module" src="./js/common.js"></script>
    <script type="module" src="./js/reservation-select.js"></script>
  </body>
</html>
